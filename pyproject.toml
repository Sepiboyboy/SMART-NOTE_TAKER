[project]
name = "notetaker"
version = "1.0.0"
description = "Event-driven AI note taker: upload audio, get a transcript and a structured summary."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sepehr Kiaei" }]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12,<0.13",
    "fastapi>=0.115,<1.0",
    "openai>=1.66,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pymongo>=4.10,<5.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
notetaker-worker = "notetaker.workers.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notetaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI's File(...) / Depends(...) defaults
